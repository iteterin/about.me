<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Илья Тетерин — resume.exe</title>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; background:#000; overflow:hidden; }
  body { font-family:"Courier New", Courier, "Lucida Console", monospace; color:#00ff41; }
  #rain { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.35; }
  #term {
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:1;
    padding:24px 32px; box-sizing:border-box; overflow-y:auto;
    font-size:16px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word;
    text-shadow:0 0 6px rgba(0,255,65,.7);
  }
  #term::-webkit-scrollbar { width:8px; } #term::-webkit-scrollbar-thumb { background:#008f11; }
  .blk-title { color:#9dffb0; font-weight:bold; }
  .dim { color:#008f11; }
  .cursor { display:inline-block; width:9px; height:1.1em; background:#00ff41; vertical-align:text-bottom;
            animation:blink .9s steps(1) infinite; margin-left:2px; }
  @keyframes blink { 50% { opacity:0; } }
  #ctrl { position:fixed; right:12px; bottom:10px; z-index:2; font-size:12px; color:#008f11; }
  #ctrl button { background:#000; color:#00ff41; border:1px solid #008f11; font-family:inherit; cursor:pointer; margin-left:4px; padding:2px 8px; }
  #ctrl button:hover { background:#003b0f; }
  /* ---------- скрытый редактор ---------- */
  #editor {
    display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:10;
    background:rgba(0,0,0,.96); padding:20px; box-sizing:border-box; overflow-y:auto; font-size:13px;
  }
  #editor h2 { margin:0 0 10px; color:#9dffb0; }
  .row { border:1px solid #008f11; padding:8px; margin-bottom:10px; }
  .row input, .row textarea, #editor input {
    width:100%; box-sizing:border-box; background:#000; color:#00ff41; border:1px solid #008f11;
    font-family:inherit; font-size:13px; padding:4px; margin:3px 0;
  }
  .row textarea { height:110px; resize:vertical; }
  .row .meta { display:flex; gap:8px; }
  .row .meta input { width:120px; }
  #editor button { background:#000; color:#00ff41; border:1px solid #00ff41; font-family:inherit; cursor:pointer; padding:4px 10px; margin:2px; }
  #editor button:hover { background:#003b0f; }
  #login { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:11; background:rgba(0,0,0,.9);
           align-items:center; justify-content:center; }
  #login div { border:1px solid #00ff41; padding:20px; background:#000; }
  #login input { background:#000; color:#00ff41; border:1px solid #008f11; font-family:inherit; padding:4px; }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="term"></div>
<div id="ctrl">
  <span class="dim">Space — пауза | → — пропустить блок | +/- — скорость</span>
  <button id="btnFull">⛶ Fullscreen</button>
  <button id="btnRestart">↻ Restart</button>
</div>

<!-- окно ввода пароля -->
<div id="login"><div>
  <div class="blk-title">ACCESS CODE:</div>
  <input type="password" id="pwd" autocomplete="off">
  <button id="pwdOk">ENTER</button> <button id="pwdCancel">ESC</button>
  <div id="pwdErr" class="dim"></div>
</div></div>

<!-- скрытый редактор -->
<div id="editor">
  <h2>[ EDITOR ] — блоки резюме</h2>
  <div class="dim">Пауза — в миллисекундах после окончания набора блока. Данные хранятся в localStorage этого браузера.</div>
  <div id="rows"></div>
  <button id="addRow">+ Добавить блок</button>
  <button id="saveAll">💾 Сохранить и перезапустить</button>
  <button id="exportJson">⬇ Экспорт JSON</button>
  <label><button type="button" onclick="document.getElementById('importFile').click()">⬆ Импорт JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none"></label>
  <button id="resetAll">⚠ Сброс к исходному</button>
  <button id="closeEd">✕ Закрыть</button>
  <hr style="border-color:#008f11">
  <div>Новый код доступа к редактору: <input id="newPwd" type="text" style="width:200px"> <button id="setPwd">Сменить</button></div>
</div>

<script>
(function () {
  'use strict';
  /* ================= 1. ДАННЫЕ ПО УМОЛЧАНИЮ ================= */
  var DEFAULT_PWD = 'neo';
  var DEFAULT_BLOCKS = [
    { title: 'ИЛЬЯ ТЕТЕРИН', pause: 2500, text:
'СИСТЕМНЫЙ АДМИНИСТРАТОР / DEVOPS (CITRIX, VDI, SERVICE DESK)\n' +
'Специализации: DevOps-инженер · Системный администратор · Системный инженер\n' +
'Занятость: полная / частичная · График: полный день, сменный, гибкий, удалённо · Готов к командировкам\n' +
'Контакты: Телефон: ____  Email: ____  Telegram: ____  GitHub: ____' },

    { title: 'НАВЫКИ // OnCall 24/7', pause: 4000, text:
'- Быстрая реакция на инциденты и решение проблем\n' +
'- Улучшение процессов, создание методических указаний\n' +
'- Автоматизация сборки диагностики и реакций на инциденты\n' +
'- Postmortem: анализ аварий, влияющих на SLA / репутационные и финансовые потери' },

    { title: 'НАВЫКИ // Серверы, сети, безопасность', pause: 5000, text:
'Управление серверами: установка/настройка Linux и Windows Server, обслуживание и модернизация оборудования\n' +
'Сети: LAN/WAN, TCP/IP, DHCP, DNS, HTTP/HTTPS, FTP; маршрутизаторы и коммутаторы\n' +
'Безопасность: межсетевые экраны, управление доступом, аудит ИБ, анализ инцидентов ИБ,\n' +
'внедрение изменений по требованиям ИБ / регулятора' },

    { title: 'НАВЫКИ // Виртуализация, бэкапы, мониторинг', pause: 5000, text:
'Виртуализация: VMware, Hyper-V, KVM; автоматизация развёртывания и конфигурации ВМ\n' +
'Резервное копирование: разработка сценариев, восстановление данных\n' +
'Мониторинг: Zabbix, Splunk, ELK/Telegraf, Grafana; диагностика и устранение неисправностей' },

    { title: 'НАВЫКИ // Автоматизация, облака, документация, soft skills', pause: 5000, text:
'Скрипты: Bash, PowerShell, Python; Ansible playbooks; Git (репозитории, ветвление, слияние)\n' +
'Облака: AWS, VK Cloud, SberCloud\n' +
'Документация: паспорт ИС, планы DRP, Postmortem notes\n' +
'Коммуникации: объяснение технических вопросов нетехнической аудитории, работа в команде,\n' +
'конструктивное разрешение конфликтов, обратная связь' },

    { title: 'ОБО МНЕ', pause: 7000, text:
'Пусть у меня нет боевого опыта в направлении DevOps, однако я много сил и времени потратил на освоение\n' +
'необходимых навыков: курсы, самообразование, домашняя «лаборатория».\n' +
'Длительное время поддерживал высоконагруженные системы (более 10 000 уникальных сессий в\n' +
'геораспределённой инфраструктуре) на базе Windows. Прошёл путь от 1-й до 3-й линии поддержки в МегаФон,\n' +
'в том числе как OnCall-дежурный 24/7. Опыт сопровождения как крупных сервисов, так и небольших компаний (до 30 пользователей).\n' +
'Продукты: Citrix (XenDesktop, XenApp, AppLayering, PVS); Microsoft (Windows Server, SQL, AD, DNS, DHCP); VMware;\n' +
'Linux (Debian, Ubuntu, CentOS, Red Hat, AstraLinux, RedOS); DLP (InfoWatch, Гарда); антивирусы.\n' +
'Домашний сервер виртуализации на RedVirt (форк oVirt): медиацентр, NAS, стенды.\n' +
'Английский: начальный, уверенно читаю техническую документацию.' },

    { title: 'ОПЫТ // МегаФон (09.2016 — н.в.)', pause: 8000, text:
'2023 — н.в.  Старший эксперт по поддержке ВРМ и систем управления приложениями\n' +
'2019 — 2023  Эксперт по поддержке ВРМ и систем управления приложениями\n' +
'2018 — 2019  Старший инженер по поддержке ВРМ\n' +
'2017 — 2018  Инженер по поддержке ВРМ\n' +
'2016 — 2017  Инженер по локальной технической поддержке пользователей\n' +
'Результаты:\n' +
'- Переход Citrix XenDesktop 6 → 7.15 (более 10 000 VM, ~50 серверов, геораспределённая инфраструктура)\n' +
'- Расширение наборов ВРМ для удалённой работы в пандемию через автоматизацию сценарием\n' +
'- Инструмент автоматизации квот (более 150 файловых серверов, более 1,5 ПБ)\n' +
'- Перенос 100 ТБ данных с физических серверов на VMware — автоматизированные сценарии\n' +
'- Обучение 4 новых сотрудников: постановка задач, контроль, обратная связь\n' +
'- Скрипты переноса файловых ресурсов (каталоги и диски) со сменой DFSn-таргета и переносом квот\n' +
'- Сценарии экстренного выключения ВРМ и перевода ресурсов в read-only (напр., вирусная атака)\n' +
'- Мониторинг файловых активов: найдено и высвобождено более 100 ТБ\n' +
'- Витрина «здоровья» файловых серверов' },

    { title: 'ОПЫТ // Ранее', pause: 5000, text:
'02.2015 — 05.2016  Приморское УФАС России — Эксперт информационно-аналитического отдела\n' +
'  Подготовил зал заседаний к аттестации объекта информатизации по требованиям безопасности информации\n' +
'10.2014 — 02.2015  Ростелеком — Инженер ГОиТОЗА (тех. поддержка абонентов, 1-я линия)\n' +
'09.2011 — 10.2014  МГУ им. адм. Г.И. Невельского — Техник-лаборант кафедры БИТС\n' +
'  Разработал методику контрольной проверки знаний старшекурсников по компьютерной безопасности' },

    { title: 'ОБРАЗОВАНИЕ', pause: 4000, text:
'Высшее. Морской государственный университет им. адм. Г.И. Невельского, Владивосток\n' +
'Физико-технологический факультет, 2010–2016\n' +
'Специальность: Информационная безопасность телекоммуникационных систем' },

    { title: 'END OF FILE', pause: 0, text:
'Wake up, recruiter... The résumé has you.\n' +
'Контакты: Email: ____  Telegram: ____  GitHub: ____' }
  ];

  /* ================= 2. ХРАНИЛИЩЕ (localStorage) ================= */
  var LS_BLOCKS = 'mx_resume_blocks', LS_PWD = 'mx_resume_pwd';
  function loadBlocks() {
    try { var s = localStorage.getItem(LS_BLOCKS); if (s) return JSON.parse(s); } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
  }
  function saveBlocks(b) { localStorage.setItem(LS_BLOCKS, JSON.stringify(b)); }
  function getPwd() { return localStorage.getItem(LS_PWD) || DEFAULT_PWD; }
  var blocks = loadBlocks();

  /* ================= 3. ДОЖДЬ ИЗ СИМВОЛОВ ================= */
  var canvas = document.getElementById('rain'), ctx = canvas.getContext('2d');
  var cols, drops, fs = 16;
  var glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789ABCDEFXYZ<>/\\|=+*';
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fs); drops = [];
    for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
  }
  window.addEventListener('resize', resize); resize();
  setInterval(function () {
    ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41'; ctx.font = fs + 'px monospace';
    for (var i = 0; i < cols; i++) {
      var ch = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
      ctx.fillText(ch, i * fs, drops[i] * fs);
      if (drops[i] * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);

  /* ================= 4. ПЕЧАТНАЯ МАШИНКА ================= */
  var term = document.getElementById('term');
  var speed = 18;          // мс на символ
  var paused = false, skip = false, runId = 0;
  function sleep(ms, id) {
    return new Promise(function (res) {
      var t0 = Date.now();
      (function tick() {
        if (id !== runId) return;          // перезапуск — прекращаем старую сессию
        if (skip) { skip = false; return res(); }
        if (paused) { t0 = Date.now() - (ms - Math.max(0, ms - (Date.now() - t0))); }
        if (!paused && Date.now() - t0 >= ms) return res();
        setTimeout(tick, 40);
      })();
    });
  }
  function typeText(target, text, id) {
    return new Promise(function (res) {
      var i = 0;
      (function step() {
        if (id !== runId) return;
        if (paused) return setTimeout(step, 60);
        if (skip) { target.textContent += text.slice(i); skip = false; return res(); }
        if (i >= text.length) return res();
        target.textContent += text.charAt(i++);
        term.scrollTop = term.scrollHeight;
        setTimeout(step, speed);
      })();
    });
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }

  async function play() {
    var id = ++runId; term.innerHTML = ''; paused = false; skip = false;
    var cur = el('span', 'cursor');
    var boot = el('div', 'dim'); term.appendChild(boot); term.appendChild(cur);
    await typeText(boot, 'root@zion:~$ ./resume.exe --user=teterin\n[ OK ] Loading ' + blocks.length + ' blocks...\n', id);
    await sleep(800, id);
    for (var b = 0; b < blocks.length; b++) {
      if (id !== runId) return;
      var blk = blocks[b];
      var t = el('div', 'blk-title'); var body = el('div');
      term.insertBefore(t, cur); term.insertBefore(body, cur);
      await typeText(t, '> ' + blk.title + '\n', id);
      await typeText(body, blk.text + '\n', id);
      var p = parseInt(blk.pause, 10); if (isNaN(p)) p = 3000;
      await sleep(p, id);
    }
    var end = el('div', 'dim'); term.insertBefore(end, cur);
    await typeText(end, 'root@zion:~$ _', id);
  }

  /* ================= 5. УПРАВЛЕНИЕ ================= */
  document.getElementById('btnRestart').onclick = play;
  document.getElementById('btnFull').onclick = function () {
    var d = document.documentElement;
    var f = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
    if (f) f.call(d);
  };
  // секретный вход в редактор: Ctrl+Shift+E или 5 кликов по углу (для мобильных)
  var taps = 0;
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.key === 'У' || e.key === 'у')) { e.preventDefault(); showLogin(); return; }
    if (document.getElementById('editor').style.display === 'block') return;
    if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
    if (e.key === 'ArrowRight') skip = true;
    if (e.key === '+' || e.key === '=') speed = Math.max(2, speed - 4);
    if (e.key === '-') speed = Math.min(80, speed + 4);
  });
  document.addEventListener('click', function (e) {
    if (e.clientX < 40 && e.clientY < 40) { if (++taps >= 5) { taps = 0; showLogin(); } } else taps = 0;
  });

  /* ================= 6. ЛОГИН В РЕДАКТОР ================= */
  var login = document.getElementById('login'), pwd = document.getElementById('pwd');
  function showLogin() { login.style.display = 'flex'; pwd.value = ''; document.getElementById('pwdErr').textContent = ''; pwd.focus(); }
  function tryLogin() {
    if (pwd.value === getPwd()) { login.style.display = 'none'; openEditor(); }
    else document.getElementById('pwdErr').textContent = 'ACCESS DENIED';
  }
  document.getElementById('pwdOk').onclick = tryLogin;
  document.getElementById('pwdCancel').onclick = function () { login.style.display = 'none'; };
  pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); if (e.key === 'Escape') login.style.display = 'none'; });

  /* ================= 7. РЕДАКТОР ================= */
  var editor = document.getElementById('editor'), rows = document.getElementById('rows');
  function renderRows() {
    rows.innerHTML = '';
    blocks.forEach(function (blk, i) {
      var r = el('div', 'row');
      var meta = el('div', 'meta');
      var title = document.createElement('input'); title.value = blk.title; title.placeholder = 'Заголовок';
      var pause = document.createElement('input'); pause.type = 'number'; pause.min = 0; pause.step = 500; pause.value = blk.pause; pause.title = 'Пауза, мс';
      var num = el('span', 'dim', '#' + (i + 1) + ' '); num.style.whiteSpace = 'nowrap';
      meta.appendChild(num); meta.appendChild(title); meta.appendChild(pause);
      var ta = document.createElement('textarea'); ta.value = blk.text;
      title.oninput = function () { blk.title = title.value; };
      pause.oninput = function () { blk.pause = parseInt(pause.value, 10) || 0; };
      ta.oninput = function () { blk.text = ta.value; };
      var btns = el('div');
      function mk(label, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; return b; }
      btns.appendChild(mk('↑', function () { if (i > 0) { blocks.splice(i - 1, 0, blocks.splice(i, 1)[0]); renderRows(); } }));
      btns.appendChild(mk('↓', function () { if (i < blocks.length - 1) { blocks.splice(i + 1, 0, blocks.splice(i, 1)[0]); renderRows(); } }));
      btns.appendChild(mk('✕ удалить', function () { if (confirm('Удалить блок #' + (i + 1) + '?')) { blocks.splice(i, 1); renderRows(); } }));
      r.appendChild(meta); r.appendChild(ta); r.appendChild(btns); rows.appendChild(r);
    });
  }
  function openEditor() { renderRows(); editor.style.display = 'block'; paused = true; }
  function closeEditor() { editor.style.display = 'none'; paused = false; }
  document.getElementById('addRow').onclick = function () { blocks.push({ title: 'НОВЫЙ БЛОК', text: '', pause: 3000 }); renderRows(); };
  document.getElementById('saveAll').onclick = function () { saveBlocks(blocks); closeEditor(); play(); };
  document.getElementById('closeEd').onclick = closeEditor;
  document.getElementById('resetAll').onclick = function () {
    if (confirm('Вернуть исходное резюме? Текущие правки будут потеряны.')) {
      localStorage.removeItem(LS_BLOCKS); blocks = loadBlocks(); renderRows();
    }
  };
  document.getElementById('exportJson').onclick = function () {
    var blob = new Blob([JSON.stringify(blocks, null, 2)], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'resume-blocks.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  document.getElementById('importFile').onchange = function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { try { blocks = JSON.parse(rd.result); renderRows(); } catch (e) { alert('Некорректный JSON'); } };
    rd.readAsText(f, 'UTF-8'); ev.target.value = '';
  };
  document.getElementById('setPwd').onclick = function () {
    var v = document.getElementById('newPwd').value.trim();
    if (v) { localStorage.setItem(LS_PWD, v); document.getElementById('newPwd').value = ''; alert('Код доступа изменён'); }
  };

  /* ================= 8. СТАРТ ================= */
  play();
})();
</script>
</body>
</html>
